<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@CSS_ADDRESS">
</head>

<body>
    <main class="sorteador-container">
        <div class="sorteador-card">
            <h1 class="sorteador-title">Sorteador</h1>
            <p class="sorteador-subtitle">Digite o número máximo e sorteie!</p>

            <div class="sorteador-form">
                <div class="input-group">
                    <label for="numero-maximo">Número máximo</label>
                    <input
                        type="number"
                        id="numero-maximo"
                        placeholder="Ex: 100"
                        min="1"
                    />
                    <span class="erro" id="erro">Insira um número maior que 0.</span>
                </div>
                <button class="btn-sortear" id="btn-sortear">Sortear</button>
            </div>

            <div class="resultado" id="resultado">
                <p class="resultado-label">Número sorteado</p>
                <p class="resultado-numero" id="numero-sorteado"></p>
            </div>
        </div>
    </main>
    <script src="@@JS_ADDRESS"></script>
</body>

</html>
